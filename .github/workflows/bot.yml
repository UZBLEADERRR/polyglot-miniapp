name: Telegram bot

# Avtomatik (cron) ishga tushish o'chirildi — har 5 daqiqada xato bilan
# tugab, bildirishnoma yuborayotgan edi. Botni qo'lda ishga tushirish uchun:
# Actions -> Telegram bot -> Run workflow.
# Qayta yoqish uchun quyidagi izohni oching:
#   schedule:
#     - cron: '*/5 * * * *'
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xabarlarni qayta ishlash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node bot.js

      - name: Holatni saqlash
        run: |
          git config user.name "daho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "bot holati"
          git push
